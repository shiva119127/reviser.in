services:
  - type: web
    name: yt-reviser-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: QDRANT_PATH
        value: ./qdrant_db
      - key: MANIFEST_PATH
        value: ./data/manifest.json
      - key: AUDIO_DIR
        value: ./data/audio
      - key: TRANSCRIPT_DIR
        value: ./data/transcripts
      - key: CHUNK_DIR
        value: ./data/chunks
